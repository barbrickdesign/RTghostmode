<!DOCTYPE html>
<html>
<head>
  <title>Loading...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #fff;
      color: #000;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <p>Loading resources...</p>

  <script>
    // 1. Fake canvas fingerprint
    const canvas = document.createElement("canvas");
    canvas.width = 200;
    canvas.height = 50;
    const ctx = canvas.getContext("2d");
    ctx.textBaseline = "top";
    ctx.font = "20px 'Arial'";
    ctx.fillStyle = "#f00";
    ctx.fillText("Ghost Cloak Activated", 10, 10);
    const canvasData = canvas.toDataURL();

    // 2. Fake WebGL fingerprint
    const getFakeWebGL = () => {
      const canvas = document.createElement("canvas");
      const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
      if (!gl) return "unavailable";
      const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
      return debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "unknown";
    };

    // 3. Fake AudioContext fingerprint
    const getFakeAudioHash = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const analyser = ctx.createAnalyser();
        osc.type = 'triangle';
        osc.connect(analyser);
        analyser.connect(ctx.destination);
        osc.start(0);
        return "ghost-audio-fingerprint";
      } catch {
        return "audio-fail";
      }
    };

    // 4. Fake identity properties
    Object.defineProperty(navigator, 'platform', { value: 'MacIntel' });
    Object.defineProperty(navigator, 'language', { value: 'ru-RU' });
    Object.defineProperty(navigator, 'languages', { value: ['ru-RU', 'en-US'] });
    Object.defineProperty(navigator, 'userAgent', {
      value: 'Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148'
    });
    Object.defineProperty(navigator, 'deviceMemory', { value: 8 });
    Object.defineProperty(navigator, 'hardwareConcurrency', { value: 2 });
    Object.defineProperty(navigator, 'vendor', { value: 'Apple Computer, Inc.' });

    Object.defineProperty(window.screen, 'width', { value: 390 });
    Object.defineProperty(window.screen, 'height', { value: 844 });

    // 5. Send to ghost logs
    fetch("/log_ghost", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        type: "identity_mask",
        canvas: canvasData,
        webgl: getFakeWebGL(),
        audio_fp: getFakeAudioHash(),
        userAgent: navigator.userAgent,
        language: navigator.language,
        timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        memory: navigator.deviceMemory,
        threads: navigator.hardwareConcurrency,
        vendor: navigator.vendor,
        width: screen.width,
        height: screen.height
      })
    });

    // 6. Cloak as 404 after delay
    setTimeout(() => {
      document.body.innerHTML = "<h1>404 Not Found</h1>";
    }, 2500 + Math.random() * 2000); // 2.5–4.5 sec delay
  </script>
</body>
</html>
