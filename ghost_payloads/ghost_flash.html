<!DOCTYPE html>
<html>
<head>
  <title>Ghost Mode Storm</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: monospace;
      text-align: center;
      padding-top: 40px;
      transition: background 0.2s;
    }
    .warning {
      font-size: 22px;
      animation: blink 0.4s infinite alternate;
    }
    @keyframes blink {
      from { color: red; }
      to { color: yellow; }
    }
  </style>
</head>
<body>
  <h1 class="warning">⚠️ GHOST MODE ACTIVATED ⚠️</h1>
  <p>Device scanning detected</p>

  <script>
    // Flashing background
    setInterval(() => {
      document.body.style.backgroundColor = `hsl(${Math.floor(Math.random()*360)},100%,50%)`;
    }, 150);

    // Vibration
    if (navigator.vibrate) {
      navigator.vibrate([300, 100, 300, 100, 300, 100, 800]);
    }

    // Voice Synth Spam
    const message = new SpeechSynthesisUtterance("Ghost mode activated. Surveillance detected. Exit now.");
    message.pitch = 1.1;
    message.rate = 0.8;
    speechSynthesis.speak(message);

    // Audio Noise
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(720, ctx.currentTime);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 4);
    } catch (e) {
      console.log("AudioContext failed");
    }
  </script>
</body>
</html>
